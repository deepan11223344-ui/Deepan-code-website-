name: DeepanCode CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Verify hash-pinned lockfile installs
      run: |
        pip install --dry-run --require-hashes -r requirements.lock

    - name: Lint with flake8
      run: |
        flake8 deepans_code/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 deepans_code/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check formatting with black
      run: |
        black --check deepans_code/

    - name: Check import order with isort
      run: |
        isort --check-only deepans_code/

    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=deepans_code --cov-report=xml -m "not integration and not e2e and not slow"

    - name: Run integration tests
      run: |
        pytest tests/ -v -m integration --cov=deepans_code --cov-append

    - name: Run e2e tests
      run: |
        pytest tests/ -v -m e2e --cov=deepans_code --cov-append

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.python-version }}
        use_oidc: true
      continue-on-error: true

  test-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run unit tests (Windows)
      run: |
        pytest tests/ -q -m "not integration and not e2e and not slow"

    - name: Run integration+e2e (Windows)
      run: |
        pytest tests/ -q -m "integration or e2e or slow"

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy

    - name: Type check with mypy
      run: |
        mypy deepans_code/ --ignore-missing-imports --no-error-summary

  build:
    runs-on: ubuntu-latest
    needs: [test, test-windows, lint]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build tools
      run: pip install build twine

    - name: Build package
      run: python -m build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  docker:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t deepans-code:${{ github.sha }} .

    - name: Test Docker image
      run: |
        docker run --rm deepans-code:${{ github.sha }} --help
